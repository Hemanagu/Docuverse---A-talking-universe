# ─────────────────────────────────────────────────────────────────────────────
# DocuVerse – Docker Compose
#
# Services:
#   api      → FastAPI (port 8000)
#   worker   → arq worker (same image, different CMD)
#   qdrant   → Qdrant vector DB (port 6333)
#   valkey   → Valkey / Redis-compatible queue broker (port 6379)
#
# First-time startup:
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuverse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-""}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
    volumes:
      # Persist uploads and collection registry between restarts
      - ./uploads:/app/uploads
      - ./collections.json:/app/collections.json
    depends_on:
      qdrant:
        condition: service_started
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/collections"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── arq PDF-processing worker ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuverse-worker
    restart: unless-stopped
    command: python -m arq worker.WorkerSettings
    environment:
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-""}
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
    volumes:
      - ./uploads:/app/uploads
      - ./collections.json:/app/collections.json
    depends_on:
      qdrant:
        condition: service_started
      valkey:
        condition: service_healthy

  # ── Qdrant vector database ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docuverse-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Valkey (Redis-compatible, open-source) ─────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: docuverse-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  qdrant_data:
  valkey_data:
